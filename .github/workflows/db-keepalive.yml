name: DB Keepalive

on:
  schedule:
    # Weekly, Sunday 03:15 UTC
    - cron: "15 3 * * 0"
  workflow_dispatch: {}

jobs:
  keepalive:
    name: Insert keepalive heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Insert heartbeat
        env:
          SUPABASE_URL: ${{ secrets.LINKRSP_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.LINKRSP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "$SUPABASE_URL/rest/v1/ops_heartbeats" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"source":"github_actions","note":"weekly_keepalive"}'

