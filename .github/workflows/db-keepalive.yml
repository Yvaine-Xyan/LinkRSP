name: DB Keepalive

on:
  schedule:
    # Weekly, Sunday 03:15 UTC
    - cron: "15 3 * * 0"
  workflow_dispatch: {}

jobs:
  keepalive:
    name: Insert keepalive heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/migrate

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Insert heartbeat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO ops_heartbeats(source, note) VALUES ('github_actions', 'weekly_keepalive');"

